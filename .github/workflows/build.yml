          package com.example.crosshair

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(28, 40, 28, 20)

                  val title = TextView(this)
                  title.text = "悬浮准星"
                  title.textSize = 28f
                  layout.addView(title)

                  val info = TextView(this)
                  info.text = "青色水平头线 + 中心十字准星"
                  info.textSize = 17f
                  layout.addView(info)

                  val permission = Button(this)
                  permission.text = "开启悬浮窗权限"
                  permission.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      }
                  }
                  layout.addView(permission)

                  val show = Button(this)
                  show.text = "显示准星"
                  show.setOnClickListener {
                      if (Settings.canDrawOverlays(this)) {
                          startService(
                              Intent(this, OverlayService::class.java)
                                  .setAction("SHOW")
                          )
                      } else {
                          Toast.makeText(this, "请先开启悬浮窗权限", Toast.LENGTH_SHORT).show()
                      }
                  }
                  layout.addView(show)

                  val hide = Button(this)
                  hide.text = "关闭准星"
                  hide.setOnClickListener {
                      startService(
                          Intent(this, OverlayService::class.java)
                              .setAction("HIDE")
                      )
                  }
                  layout.addView(hide)

                  val note = TextView(this)
                  note.text = "拖动悬浮线调整高度，点击中心位置锁定或解锁。"
                  note.textSize = 15f
                  layout.addView(note)

                  setContentView(layout)
              }
          }
